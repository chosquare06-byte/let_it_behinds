<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abandoned But Not Forgotten | NASA Space Apps API Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070f;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-cyan);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* NASA API Media Section */
        .nasa-api-box {
            background: rgba(5, 7, 15, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .nasa-api-box img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
        }

        .api-caption {
            padding: 12px 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .story-content {
            background: rgba(5, 7, 15, 0.6);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 0 12px 12px 0;
            padding: 22px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #cbd5e1;
            margin: 20px 0;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        button {
            font-family: 'Orbitron', sans-serif;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: var(--accent-cyan);
            color: #05070f;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
            color: var(--text-muted);
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h3>NASA Space Apps Challenge</h3>
        <h1>Abandoned But Not Forgotten</h1>
    </div>

    <div class="container">
        <div class="top-bar">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="artifact-status">Status</span>
            </div>
            <div style="font-family: 'Orbitron'; color: var(--text-muted);" id="artifact-counter">1 / 7</div>
        </div>

        <div style="margin-bottom: 15px;">
            <h2 style="font-family: 'Orbitron'; font-size: 1.8rem;" id="artifact-name">Loading...</h2>
            <p style="color: var(--text-muted);" id="artifact-location">📍 Location</p>
        </div>

        <!-- NASA Live API Feature Box -->
        <div class="nasa-api-box">
            <img id="nasa-img" src="" alt="Loading NASA API Media...">
            <div class="api-caption">
                <span>🛰️ Live NASA API Feed</span>
                <span id="api-title">Fetching NASA Media...</span>
            </div>
        </div>

        <div class="story-content" id="artifact-story">
            Loading story...
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="label">Launch Date</div>
                <div class="value" id="stat-launch">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Distance / Lifetime</div>
                <div class="value" id="stat-life">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Primary Legacy</div>
                <div class="value" id="stat-legacy">-</div>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="prevArtifact()">← PREVIOUS</button>
            <button id="next-btn" onclick="nextArtifact()">NEXT →</button>
        </div>
    </div>

    <footer>
        Data dynamically fetched via <a href="https://api.nasa.gov/" target="_blank">Official NASA Open API</a>
    </footer>

    <script>
        const artifacts = [
            {
                name: "Opportunity Rover (Oppy)",
                status: "Final Transmission: June 10, 2018",
                location: "Endeavour Crater, Mars",
                query: "Mars Opportunity Rover",
                story: "Designed for a 90-day mission, Opportunity explored Mars for over 14 years. It discovered hematite spheres providing absolute proof that ancient liquid water once washed over the Martian surface before a global dust storm cut off solar power.",
                launch: "July 7, 2003",
                lifetime: "45.16 KM Traveled",
                legacy: "Proved Ancient Martian Water"
            },
            {
                name: "Apollo 15 Lunar Roving Vehicle",
                status: "Parked Since August 1971",
                location: "Hadley Rille, Moon",
                query: "Apollo 15 Lunar Rover",
                story: "The world's first electric vehicle driven on another world. Left parked in the vacuum of space at Hadley-Apennine, it allowed astronauts to collect over 77 kg of lunar surface rock samples.",
                launch: "July 26, 1971",
                lifetime: "27.8 KM Driven",
                legacy: "First Lunar Wheel Tracks"
            },
            {
                name: "Voyager 1 & The Golden Record",
                status: "Interstellar Mission Active",
                location: ">24 Billion KM From Earth",
                query: "Voyager Golden Record",
                story: "Carrying a gold-plated copper phonograph record encoded with greetings in 55 languages and sounds of Earth, Voyager 1 became the first human spacecraft to cross into interstellar space.",
                launch: "September 5, 1977",
                lifetime: "47+ Years Flight",
                legacy: "First Interstellar Spacecraft"
            }
        ];

        let currentIndex = 0;

        // Fetching live images directly from NASA's official Media Search API
        async function fetchNasaImage(searchQuery) {
            const imgElement = document.getElementById('nasa-img');
            const titleElement = document.getElementById('api-title');
            titleElement.innerText = "Connecting to NASA API...";

            try {
                const response = await fetch(`https://images-api.nasa.gov/search?q=${encodeURIComponent(searchQuery)}&media_type=image`);
                const data = await response.json();
                
                if (data.collection.items.length > 0) {
                    const firstResult = data.collection.items[0];
                    imgElement.src = firstResult.links[0].href;
                    titleElement.innerText = firstResult.data[0].title.substring(0, 45) + "...";
                }
            } catch (error) {
                console.error("NASA API Error:", error);
                titleElement.innerText = "NASA Archive Feed";
            }
        }

        function updateUI() {
            const current = artifacts[currentIndex];
            document.getElementById('artifact-name').innerText = current.name;
            document.getElementById('artifact-status').innerText = current.status;
            document.getElementById('artifact-location').innerText = "📍 " + current.location;
            document.getElementById('artifact-story').innerText = current.story;
            document.getElementById('stat-launch').innerText = current.launch;
            document.getElementById('stat-life').innerText = current.lifetime;
            document.getElementById('stat-legacy').innerText = current.legacy;
            document.getElementById('artifact-counter').innerText = `${currentIndex + 1} / ${artifacts.length}`;

            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === artifacts.length - 1);

            // Trigger the live NASA API fetch for each card
            fetchNasaImage(current.query);
        }

        function nextArtifact() {
            if (currentIndex < artifacts.length - 1) {
                currentIndex++;
                updateUI();
            }
        }

        function prevArtifact() {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
